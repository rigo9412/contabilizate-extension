<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contabilizate</title>
  <style>
    :root {
      --primary: #03301d;
      --accent: #86ee02;
      --muted: #5b6b64;
      --border: #dfe7e3;
      --bg: #ffffff;
      --soft: #f3f6f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 320px;
      padding: 16px;
      font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--primary);
      background: var(--bg);
    }
    h1 { margin: 0 0 12px; font-size: 18px; }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: var(--soft);
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .label { color: var(--muted); font-size: 12px; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--border); }
    .badge.ok { background: var(--accent); }
    .pending-title { font-weight: 600; }
    button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--primary);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: var(--soft); }
    button.primary { background: var(--primary); color: var(--accent); border-color: var(--primary); }
    button.link {
      display: inline;
      width: auto;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: var(--primary);
      text-decoration: underline;
      font-size: 12px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Contabilizate</h1>

  <div class="card row">
    <span>e.firma</span>
    <span id="vaultStatus" class="badge">…</span>
  </div>

  <div id="pending" class="card" hidden>
    <div class="label">Factura lista para emitir</div>
    <div class="row">
      <span id="pendingTitle" class="pending-title"></span>
      <button id="btnDiscard" class="link" type="button">Descartar</button>
    </div>
    <div id="pendingDetail" class="label"></div>
  </div>

  <button id="btnOpenApp" class="primary" type="button">Abrir Contabilizate</button>
  <button id="btnPortal" type="button">Ir al portal de facturación del SAT</button>

  <script src="js/popup.js"></script>
</body>
</html>
