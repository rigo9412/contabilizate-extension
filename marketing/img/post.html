<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#1d4a33 0%,#0c2418 70%);color:#fff;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.top{padding:72px 80px 0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:14px;font-weight:700;font-size:34px}
.brand img{height:52px}
h1{font-size:84px;line-height:1.02;letter-spacing:-.03em;margin-top:44px}
.accent{color:#93e23f}
.lead{color:#b8d4c3;font-size:32px;line-height:1.35;margin:28px auto 0;max-width:860px}
.pills{display:flex;justify-content:center;gap:14px;margin-top:36px}
.pills span{background:rgba(147,226,63,.14);border:1.5px solid rgba(147,226,63,.4);color:#c9f59a;border-radius:999px;padding:10px 22px;font-weight:600;font-size:25px}
.shot{position:absolute;left:90px;right:90px;top:610px;border-radius:22px 22px 0 0;overflow:hidden;border:2px solid rgba(255,255,255,.14);box-shadow:0 -20px 80px rgba(147,226,63,.18),0 30px 80px rgba(0,0,0,.5)}
.bar{background:#163a28;height:38px;display:flex;align-items:center;gap:9px;padding-left:18px}
.bar i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.25)}
.shot img{display:block;width:100%}
.cta{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:#93e23f;color:#0c2418;font-weight:800;font-size:32px;padding:22px 46px;border-radius:999px;white-space:nowrap;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.fade{position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(transparent,#0c2418 80%)}
</style></head><body>
<div class="top">
  <div class="brand"><img src="../../docs/img/logo.png">Contabilizate</div>
  <h1>Tus impuestos del SAT,<br><span class="accent">sin hojas de cálculo</span></h1>
  <p class="lead">Convierte tus CFDI en ingresos, gastos e ISR/IVA listos para tu declaración RESICO.</p>
  <div class="pills"><span>🆓 100% gratis</span><span>💻 Sin servidores</span><span>🔒 Tus datos son tuyos</span></div>
</div>
<div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="../../docs/img/dashboard.jpg"></div>
<div class="fade"></div>
<div class="cta">Instálala gratis en Chrome →</div>
</body></html>
